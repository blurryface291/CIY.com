<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — WeTraders Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --red:#E63946; --green:#00C853; --gold:#D4AF37; --gold-light:#F3D884; --ink:#0F1120; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Mulish',sans-serif; background:var(--ink); color:#FFF; min-height:100vh;
    display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  }
  .poppins { font-family:'Poppins',sans-serif; }
  .bg-glow {
    position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(circle at 50% 34%, rgba(0,200,83,.14), transparent 55%),
      radial-gradient(circle at 82% 8%, rgba(212,175,55,.10), transparent 45%);
  }
  .bg-pattern {
    position:absolute; inset:0; z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
    background-size:22px 22px; opacity:.25;
  }
  .login-container { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1; }
  .login-card {
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(12px); border-radius:18px; padding:44px 40px; width:100%;
    max-width:420px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .logo-img { width:92px; height:92px; border-radius:50%; object-fit:cover; margin-bottom:22px; background:#0A2E14; border:2px solid var(--gold); }
  .login-title { color:var(--gold); font-weight:700; font-size:23px; margin-bottom:4px; }
  .login-subtitle { color:#A0A3BD; font-size:14px; margin-bottom:30px; }
  .google-btn {
    background:#FFF; color:#333; border-radius:10px; padding:13px 20px; font-weight:600; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:12px; width:100%; border:none;
    transition:all .2s; cursor:pointer; font-family:'Mulish',sans-serif;
  }
  .google-btn:hover { background:#F1F1F1; transform:translateY(-2px); }
  .google-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .role-note {
    margin-top:24px; padding-top:20px; border-top:1px solid rgba(255,255,255,.08);
    font-size:12.5px; color:#6B6F8D; line-height:1.7;
  }
  .role-note b { color:#A0A3BD; font-weight:600; }
  .back-link { display:inline-block; margin-top:22px; color:#A0A3BD; font-size:14px; text-decoration:none; transition:color .2s; }
  .back-link:hover { color:#FFF; }
  .footer-text { text-align:center; color:rgba(255,255,255,.4); font-size:12px; padding:20px; position:relative; z-index:1; }
  #errorMsg {
    display:none; background:rgba(230,57,70,.16); color:#ffb3b8; border:1px solid var(--red);
    padding:11px 14px; border-radius:8px; font-size:13px; margin-top:20px; text-align:left;
  }
  #loadingSpinner { display:none; margin-top:22px; }
  .spin { width:26px; height:26px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--gold); border-radius:50%; animation:sp .8s linear infinite; margin:0 auto; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-pattern"></div>

<div class="login-container">
  <div class="login-card">
    <img src="wetraders-logo-master.png" onerror="this.onerror=null;this.src='logo.png';" alt="WeTraders" class="logo-img">
    <h1 class="poppins login-title">WeTraders Institute</h1>
    <p class="login-subtitle">Sign in to your portal</p>

    <button id="googleLoginBtn" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
      </svg>
      Sign in with Google
    </button>

    <div id="loadingSpinner"><div class="spin"></div></div>
    <div id="errorMsg"></div>

    <div class="role-note">
      One sign-in, three portals. You are sent to the right one automatically:<br>
      <b>Students</b> see classes, materials and fees · <b>Admins</b> publish content · <b>Master Admins</b> manage roles.
    </div>

    <a href="index.html" class="back-link"><i class="fas fa-arrow-left" style="margin-right:6px"></i>Back to home</a>
  </div>
</div>

<div class="footer-text">© 2026 WeTraders Trading Institute. All rights reserved.</div>

<script type="module">
import { supabase, HOME_FOR } from './assets/supabase-core.js';

const btn     = document.getElementById('googleLoginBtn');
const spinner = document.getElementById('loadingSpinner');
const errorEl = document.getElementById('errorMsg');

function busy(on) {
  btn.style.display = on ? 'none' : 'flex';
  spinner.style.display = on ? 'block' : 'none';
  if (on) errorEl.style.display = 'none';
}
function fail(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  busy(false);
}

/* Fetch the role, then route. The profile is auto-created by DB trigger on first login. */
async function routeFor(user) {
  const { data: profile } = await supabase
    .from('users')
    .select('role')
    .eq('id', user.id)
    .single();

  let role = 'student';
  if (profile && ['student','admin','masterAdmin'].includes(profile.role)) {
    role = profile.role;
  }
  location.replace(HOME_FOR[role] || 'student.html');
}

// On load, check if already signed in (or returning from OAuth redirect)
async function checkAuth() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    busy(true);
    try {
      await routeFor(session.user);
    } catch (e) {
      console.error(e);
      fail('Signed in, but we could not load your profile. Please try again.');
    }
  }

  // Listen for auth changes
  supabase.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      busy(true);
      await routeFor(session.user);
    }
  });
}
// Explain why they landed back here, if we know
if (new URLSearchParams(location.search).get('reason') === 'timeout') {
  errorEl.textContent = 'You were signed out after 15 minutes of inactivity. Please sign in again.';
  errorEl.style.display = 'block';
}

checkAuth();

btn.addEventListener('click', async () => {
  busy(true);
  try {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/login.html' }
    });
    if (error) throw error;
  } catch (e) {
    console.error('Login failed:', e);
    fail('Sign-in failed. Please try again.');
  }
});
</script>
</body>
</html>
