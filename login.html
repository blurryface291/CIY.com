<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WeTraders Student Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --red: #E63946;
      --green: #00C853;
      --ink: #1A1A2E;
      --gold: #D4AF37;
    }
    body {
      font-family: 'Mulish', sans-serif;
      background-color: var(--ink);
      color: #FFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .poppins {
      font-family: 'Poppins', sans-serif;
    }
    /* Subtle background pattern */
    .bg-pattern {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.3;
      z-index: 0;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      background: #0A2E14;
      border: 2px solid var(--gold);
    }
    .login-title {
      color: var(--gold);
      font-weight: 700;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .login-subtitle {
      color: #A0A0B0;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .google-btn {
      background: #FFF;
      color: #333;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      border: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .google-btn:hover {
      background: #F0F0F0;
      transform: translateY(-2px);
    }
    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #A0A0B0;
      font-size: 14px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #FFF;
      text-decoration: none;
    }
    .footer-text {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    #errorMsg {
      display: none;
      background: rgba(230, 57, 70, 0.2);
      color: #ffb3b8;
      border: 1px solid var(--red);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 20px;
    }
    #loadingSpinner {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="login-container">
    <div class="login-card">
      <img src="wetraders-logo-master.png" onerror="this.onerror=null; this.src='logo.png';" alt="WeTraders Logo" class="logo-img">
      <h1 class="poppins login-title">WeTraders Institute</h1>
      <p class="login-subtitle">Student Portal</p>
      
      <button id="googleLoginBtn" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
        </svg>
        Sign in with Google
      </button>

      <div id="loadingSpinner">
        <div class="spinner-border text-light spinner-border-sm" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>

      <div id="errorMsg"></div>

      <a href="index.html" class="back-link"><i class="fas fa-arrow-left mr-1"></i> Back to Home</a>
    </div>
  </div>

  <div class="footer-text">
    © 2024 WeTraders Institute. All rights reserved.
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6rUPT3jiDGvhihHV7B1Zfn-cXpGnsDCk",
      authDomain: "ciypvtltd-a7b93.firebaseapp.com",
      projectId: "ciypvtltd-a7b93",
      storageBucket: "ciypvtltd-a7b93.firebasestorage.app",
      messagingSenderId: "298998467154",
      appId: "1:298998467154:web:251622642f7749dcab6d8b",
      measurementId: "G-5QW78G65XN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const btn = document.getElementById('googleLoginBtn');
    const spinner = document.getElementById('loadingSpinner');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      spinner.style.display = 'none';
      btn.style.display = 'flex';
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    btn.addEventListener('click', async () => {
      btn.style.display = 'none';
      errorMsg.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const userRef = doc(db, 'users', user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            email: user.email,
            displayName: user.displayName,
            photoURL: user.photoURL,
            role: 'student',
            createdAt: serverTimestamp()
          });
        }
        
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error("Login failed:", error);
        showError("Authentication failed. Please try again.");
      }
    });
  </script>
</body>
</html>
